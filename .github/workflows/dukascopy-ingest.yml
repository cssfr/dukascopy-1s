name: Dukascopy gap-fill 1s
on:
  # schedule:
  #   - cron: '30 1 * * *'    # Every day at 01:30 UTC
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_KEY:       ${{ secrets.MINIO_KEY }}
      MINIO_SECRET:    ${{ secrets.MINIO_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python + node + tools
        run: |
          set -euo pipefail
          pip install pandas pyarrow pyyaml yq
          npm install -g dukascopy-node

          MC_PATH=/usr/local/bin/mc
          MC_URL="https://github.com/minio/mc/releases/latest/download/mc-linux-amd64"

          echo "Downloading mc from $MC_URL"
          curl -fL --retry 3 --retry-delay 2 "$MC_URL" -o "$MC_PATH" \
            || {
              echo "[WARN] Primary download failed; attempting fallback to dl.min.io"
              curl -fL --retry 3 --retry-delay 2 "https://dl.min.io/client/mc/release/linux-amd64/mc" -o "$MC_PATH"
            }

          chmod +x "$MC_PATH"

          echo "[DEBUG] file output:"
          file "$MC_PATH" || true

          echo "[DEBUG] first 160 bytes (hexdump):"
          head -c 160 "$MC_PATH" | hexdump -C | sed -n '1,6p' || true

          if ! "$MC_PATH" --version >/dev/null 2>&1 ; then
            echo "[ERROR] mc binary invalid or not executable. Dumping first 200 bytes:"
            head -c 200 "$MC_PATH" || true
            exit 1
          fi

          echo "[INFO] mc installed: $($MC_PATH --version)"
          # Retry mc alias set - endpoint DNS (sslip.io) and MinIO probe can hiccup;
          # the alias setup includes a credential probe that fails on transient lookup timeouts.
          for i in 1 2 3 4 5; do
            if mc alias set myminio "$MINIO_ENDPOINT" "$MINIO_KEY" "$MINIO_SECRET"; then
              echo "[INFO] mc alias set succeeded (attempt $i)"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "[ERROR] mc alias set failed after 5 attempts"
              exit 1
            fi
            echo "[WARN] mc alias set failed (attempt $i/5), retrying in 30s"
            sleep 30
          done

      - name: Sync status JSONs from MinIO
        # daily_ingest.py reads `_status.json` files locally to:
        #   1. compute latest_attempted_date() (sets the forward-sweep start)
        #   2. find recent FAILED days to retry
        # Pull just the JSON markers (parquet bodies stay remote — ~KB vs GB).
        run: |
          set -euo pipefail
          mkdir -p ohlcv/1s
          mc mirror --exclude "*.parquet" --overwrite \
            myminio/dukascopy-node/ohlcv/1s/ ohlcv/1s/

      - name: Run daily_ingest.py
        # No --from override needed: the script computes the start date from
        # the synced status JSONs, and runs retry_failed_days() over the last
        # 30 days of FAILED markers before the forward sweep.
        run: |
          set -euo pipefail
          python daily_ingest.py

      - name: Sync output back to MinIO
        # Mirror unconditionally — Saturday runs may produce only EMPTY
        # status JSONs (no parquets), and those markers must still reach
        # MinIO so they're visible to the next run.
        run: |
          set -euo pipefail
          if [ -d ohlcv/1s ]; then
            mc mirror --overwrite ohlcv/1s/ myminio/dukascopy-node/ohlcv/1s/
          else
            echo "No ohlcv/1s directory — nothing to sync"
          fi

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
